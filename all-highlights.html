<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Highlights Library</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="library-page">

    <header class="library-header">

        <div class="library-title">
            <h1>Highlights Library</h1>
            <p id="librarySummary" class="library-summary"></p>
        </div>

        <div class="library-toolbar">

            <input id="searchInput" class="search-input" type="search"
                placeholder="Search text, notes, tags, sites"
                aria-label="Search highlights" autocomplete="off">

            <div class="export-menu">
                <button id="exportBtn" class="secondary-button" type="button"
                    aria-haspopup="true" aria-expanded="false" aria-controls="exportPanel">
                    Export
                </button>
                <div id="exportPanel" class="export-panel" hidden></div>
            </div>

            <button id="importBtn" class="secondary-button" type="button">Import</button>
            <input id="importFile" type="file" accept=".json,application/json" hidden>

        </div>

    </header>

    <div id="libraryStatus" class="library-status" role="status" hidden></div>

    <div class="library-layout">

        <nav id="librarySidebar" class="library-sidebar" aria-label="Pages and tags"></nav>

        <main id="libraryMain" class="library-main"></main>

    </div>

    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script src="library-tools.js"></script>
    <script src="all-highlights.js"></script>

</body>

</html>
