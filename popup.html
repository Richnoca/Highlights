<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Highlights</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="popup">

  <h2>Highlights</h2>

  <div id="colorChoice"></div>

  <button id="highlightBtn" class="main-button">
    Highlight Selected Text
  </button>

  <p id="statusMessage" class="status-message" hidden></p>

  <p id="shortcutHint" class="shortcut-hint" hidden></p>

  <button id="viewAllBtn" class="main-button">
    View All Highlights
  </button>

  <h3>Saved Highlights</h3>

  <p id="pageTitle" class="page-title" hidden></p>

  <a id="pageLibraryLink" class="page-library-link" href="#" hidden>
    Show this page in the library
  </a>

  <div id="highlightList"></div>

  <script src="storage.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>

</body>

</html>
